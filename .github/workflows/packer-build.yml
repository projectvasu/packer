name: Build Base AMI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::133089467747:role/github-actions-packer
          aws-region: ap-south-1

      - name: Install Packer
        uses: hashicorp/setup-packer@main

      - name: Initialise
        run: packer init .
        working-directory: base

      - name: Validate
        run: packer validate .
        working-directory: base

      - name: Build AMI
        run: packer build -color=false base-ami.pkr.hcl
        working-directory: base
